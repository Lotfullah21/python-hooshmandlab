<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Background -->
  <rect width="500" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="250" y="30" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Call Stack Visualization</text>
  
  <!-- Main Call Stack Container -->
  <rect x="100" y="50" width="300" height="320" fill="#e9ecef" stroke="#495057" stroke-width="2" rx="5" />
  <text x="250" y="70" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Call Stack</text>
  
  <!-- Global Frame (always at bottom) -->
  <rect x="120" y="260" width="260" height="90" fill="#fff" stroke="#495057" stroke-width="2" rx="5" />
  <text x="250" y="280" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Global Frame</text>
  <text x="140" y="300" font-family="Arial" font-size="11">num = value from input()</text>
  <text x="140" y="320" font-family="Arial" font-size="11">x = 24 (after fact() returns)</text>
  <text x="140" y="340" font-family="Arial" font-size="11">Return address: N/A (program end)</text>
  
  <!-- fact() Function Frame -->
  <rect x="120" y="100" width="260" height="150" fill="#fff" stroke="#495057" stroke-width="2" rx="5" />
  <text x="250" y="120" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">fact() Frame</text>
  <text x="140" y="140" font-family="Arial" font-size="11">Parameter: num = 4</text>
  <text x="140" y="160" font-family="Arial" font-size="11">Local: ans = 24 (after calculation)</text>
  <text x="140" y="180" font-family="Arial" font-size="11">Local: ele = 4 (last loop value)</text>
  <text x="140" y="200" font-family="Arial" font-size="11">Calculation completed: 4! = 24</text>
  <text x="140" y="220" font-family="Arial" font-size="11">Return value: 24</text>
  <text x="140" y="240" font-family="Arial" font-size="11">Return address: line after x = fact(4)</text>
  
  <!-- Arrows showing execution flow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057" />
    </marker>
  </defs>
  
  <!-- Arrow showing function call -->
  <line x1="400" y1="150" x2="450" y2="150" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="425" y="140" font-family="Arial" font-size="10" text-anchor="middle">1. Call</text>
  
  <!-- Arrow showing return -->
  <line x1="450" y1="200" x2="400" y2="200" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="425" y="220" font-family="Arial" font-size="10" text-anchor="middle">2. Return 24</text>
</svg>